[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gwtorch"
version = "0.1.0"
description = "Gravitational wave ML utilities and analysis"
authors = [
    { name = "Saqlain Afroz", email = "sqn3680@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy==2.1.2",
    "pandas==2.2.3",
    "matplotlib==3.10.3"
]

[project.optional-dependencies]
ml = [
    "vit-pytorch==1.10.1",
    "scikit-learn>=1.6.1"
]

gw = [
    "PyCBC==2.9.0",
    "bilby==2.5.1",
    "gwpy==3.0.12"
]

all = [
    "PyCBC==2.9.0",
    "bilby==2.5.1",
    "gwpy==3.0.12"
]

[project.scripts]
# Waveform generation tools
generate_fitting_factor_dataset_gwtorch = "gwtorch.waveform_generation.fitting_factor_gen:main"
generate_match_dataset_gwtorch = "gwtorch.waveform_generation.match_gen:main"
generate_match_dataset_dag_gwtorch = "gwtorch.waveform_generation.match_gen_dag:main"

# Dagman generation tool
generate_data_dagman_gwtorch = "gwtorch.condor.data_dagman:main"
generate_training_condor_gwtorch = "gwtorch.condor.train_condor:main"

# Training tools
cnn_train_gwtorch = "gwtorch.training.cnn:main"
transformer_train_gwtorch = "gwtorch.training.transformer:main"
binary_transformer_train_gwtorch = "gwtorch.training.binary_transformer_classifier:main"
binary_cnn_train_gwtorch = "gwtorch.training.binary_cnn_classifier:main"
hybrid_transformer_train_gwtorch = "gwtorch.training.hybrid_transformer:main"

# Inference tools
transformer_inference_gwtorch = "gwtorch.inference.transformer_eval:main"
cnn_inference_gwtorch = "gwtorch.inference.cnn_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gwtorch*"]
