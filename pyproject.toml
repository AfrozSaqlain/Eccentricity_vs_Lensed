[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gwtorch"
version = "0.1.0"
description = "Gravitational wave ML utilities and analysis"
authors = [
    { name = "Saqlain Afroz", email = "sa20ms230@iiserkol.ac.in" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy==2.1.2",
    "pandas==2.2.3",
    "matplotlib==3.10.3"
]

[project.optional-dependencies]
ml = [
    "vit-pytorch==1.10.1",
    "scikit-learn>=1.6.1"
]

gw = [
    "PyCBC==2.9.0",
    "bilby==2.5.1",
    "gwpy==3.0.12"
]

all = [
    "PyCBC==2.9.0",
    "bilby==2.5.1",
    "gwpy==3.0.12"
]

[project.scripts]
# Waveform generation tools
generate_waveform_gwtorch = "gwtorch.waveform_generation.gen:main"
filtered_waveform_gen_gwtorch = "gwtorch.waveform_generation.gen_ln_B:main"
exp_data_gen_gwtorch = "gwtorch.waveform_generation.gen_with_additional_functionalities:main"

# Training tools
cnn_train_gwtorch = "gwtorch.training.cnn:main"
transformer_train_gwtorch = "gwtorch.training.transformer:main"
binary_transformer_train_gwtorch = "gwtorch.training.binary_transformer_classifier:main"
binary_cnn_train_gwtorch = "gwtorch.training.binary_cnn_classifier:main"

# Inference tools
transformer_inference_gwtorch = "gwtorch.inference.transformer_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gwtorch*"]
