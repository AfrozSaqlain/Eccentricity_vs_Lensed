name: gwtorch-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - gcc_linux-64
  - gxx_linux-64
  - gsl
  - gmpy2
  - mpmath
  - Cython
  - numpy=2.1.2
  - pandas=2.2.3
  - matplotlib=3.10.3
  - scipy=1.15.3
  - seaborn
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - scikit-learn
      - vit-pytorch
      - git+https://git.ligo.org/anuj.mishra/gwmat.git@main
      - -e .[all]
